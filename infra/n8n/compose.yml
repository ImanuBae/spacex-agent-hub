services:
  postgres:
    image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n_admin
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${N8N_POSTGRES_ADMIN_PASSWORD:?Run node scripts/n8n-local.mjs init}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Missing database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-n8n.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U n8n_admin -d n8n']
      interval: 5s
      timeout: 3s
      retries: 30
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.4@sha256:4384b9ff20a78bc1708c35ce7864f84f724611de7801fb36d715998db7c000f1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${N8N_LOCAL_PORT:-5678}:5678'
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Missing database password}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Missing persistent encryption key}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_LOCAL_PORT:-5678}/
      WEBHOOK_URL: http://localhost:${N8N_LOCAL_PORT:-5678}/
      N8N_SECURE_COOKIE: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 2
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL: 1440
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:5678/healthz/readiness").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))']
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
volumes:
  postgres_data:
  n8n_data:
