name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Remove lockfile to regenerate for Linux
        run: rm -f package-lock.json
      - run: npm install --include=optional
      - run: npm run check
  messaging:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4
        env:
          RABBITMQ_DEFAULT_USER: spacex
          RABBITMQ_DEFAULT_PASS: spacex_dev
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Remove lockfile to regenerate for Linux
        run: rm -f package-lock.json
      - run: npm install --include=optional
      - run: npm run demo:messaging
      - run: npm test --workspace=@spacex/messaging
        env:
          RABBITMQ_TEST_URL: amqp://spacex:spacex_dev@127.0.0.1:5672
